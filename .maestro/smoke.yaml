# Maestro smoke flow — proves the harness can launch the app and reach the
# first screen (the unauthenticated Welcome screen, app/index.tsx -> Views/welcome).
#
# appId is the Android package / iOS bundleIdentifier from app.json:
#   android.package        = com.anonymous.matomeapp
#   ios.bundleIdentifier   = com.anonymous.matomeapp
# Maestro launches an INSTALLED app by this id — see .docs/TESTING.md (E2E)
# for the prerequisites (emulator + installed dev-client / release build).
#
# The assertions below target HARDCODED literal copy on the Welcome screen
# (Views/welcome/Welcome.tsx) — not i18n keys — so they are stable regardless
# of the active locale (en/ja) and require NO auth and NO network call.
appId: com.anonymous.matomeapp
---
- launchApp:
    clearState: false
# Wordmark — Views/welcome/Welcome.tsx renders the literal "MATOME".
- assertVisible: "MATOME"
# Headline accent — literal "Finally organized." on the first screen.
- assertVisible: "Finally organized."
# Primary CTA feature subtitle — literal, locale-independent.
- assertVisible: "Tap once. We handle the rest."
