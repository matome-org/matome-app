# LAN-only validation stack for Dokploy on the same host as LM Studio.
#
# This intentionally uses the development Core image so Swoosh's local mailbox
# remains available at /dev/mailbox. AI processing is not stubbed: ai-core runs
# real local Whisper. LM Studio is reachable from ai-core for the existing
# OpenAI-compatible seam, but chat models are not yet registered as job
# processors for summaries or titles.
#
# Every browser-reachable URL is derived from HOST_IP and the port variables,
# so the LAN address is declared once. Each derived value still accepts a
# direct override (API_BASE_URL, CORS_ORIGINS, STORAGE_S3_ENDPOINT,
# DATABASE_URL) when the default shape does not fit.
name: matome-localserver

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-matome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-matome}
    volumes:
      - matome_localserver_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_S3_ACCESS_KEY_ID:-matome}
      MINIO_ROOT_PASSWORD: ${STORAGE_S3_SECRET_ACCESS_KEY:?set STORAGE_S3_SECRET_ACCESS_KEY}
    volumes:
      - matome_localserver_minio:/data
    ports:
      - "${MINIO_PORT:-7021}:9000"
      - "${MINIO_CONSOLE_PORT:-7022}:9001"

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    environment:
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-matome}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:?set STORAGE_S3_SECRET_ACCESS_KEY}
      STORAGE_MEDIA_BUCKET: ${STORAGE_MEDIA_BUCKET:-media}
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$STORAGE_S3_ACCESS_KEY_ID" "$$STORAGE_S3_SECRET_ACCESS_KEY" >/dev/null 2>&1; do
          echo "waiting for MinIO..."; sleep 1;
        done
        mc mb --ignore-existing "local/$$STORAGE_MEDIA_BUCKET"

  ai-core:
    build:
      context: ./services/ai-core
      dockerfile: Dockerfile
      args:
        # whisper.cpp ships a compact CPU wheel and avoids Torch/CUDA/Triton.
        WHISPER_EXTRA: whispercpp
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AI_ENGINE_DISPATCH_TOKEN: ${AI_ENGINE_DISPATCH_TOKEN:?set AI_ENGINE_DISPATCH_TOKEN}
      AI_JOB_DATA_PATH: /var/lib/matome-ai-core/jobs.sqlite3
      # LAN validation uses HTTP media and callback URLs. The production stack
      # keeps HTTPS enforcement enabled.
      AI_REQUIRE_HTTPS_URLS: "false"
      WHISPER_BACKEND: ${WHISPER_BACKEND:-whispercpp}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      # Prepared for the existing provider-neutral client. The current job
      # registry still uses local Whisper only.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:1234}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-lm-studio}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-60}
    volumes:
      - matome_localserver_ai_jobs:/var/lib/matome-ai-core
      - matome_localserver_whisper_models:/home/app/.local/share/pywhispercpp/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  core:
    build:
      context: ./services/api
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ai-core:
        condition: service_healthy
    environment:
      PHX_HTTP_IP: 0.0.0.0
      PORT: 7001
      # Derived from the POSTGRES_* pair so the password is declared once.
      # Generated secrets are hex, so no URL escaping is required.
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-matome}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-matome}}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      GUARDIAN_SECRET_KEY: ${GUARDIAN_SECRET_KEY:?set GUARDIAN_SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://${HOST_IP:?set HOST_IP}:${WEB_PORT:-7000}}
      ADMIN_EMAIL_ALLOWLIST: ${ADMIN_EMAIL_ALLOWLIST:-dev@matome.test}
      ADMIN_OTP_PEPPER: ${ADMIN_OTP_PEPPER:?set ADMIN_OTP_PEPPER}
      AI_ENGINE_ENDPOINT: http://ai-core:8000/v1/jobs
      AI_ENGINE_DISPATCH_TOKEN: ${AI_ENGINE_DISPATCH_TOKEN:?set AI_ENGINE_DISPATCH_TOKEN}
      AI_ENGINE_CALLBACK_SIGNING_SECRET: ${AI_ENGINE_CALLBACK_SIGNING_SECRET:?set AI_ENGINE_CALLBACK_SIGNING_SECRET}
      # The callback stays on the private Compose network.
      AI_ENGINE_CALLBACK_BASE_URL: http://core:7001
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-http://${HOST_IP:?set HOST_IP}:${MINIO_PORT:-7021}}
      STORAGE_S3_INTERNAL_ENDPOINT: http://minio:9000
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-matome}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:?set STORAGE_S3_SECRET_ACCESS_KEY}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-local}
      STORAGE_MEDIA_BUCKET: ${STORAGE_MEDIA_BUCKET:-media}
    ports:
      - "${CORE_PORT:-7001}:7001"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/7001'"]
      interval: 10s
      timeout: 3s
      retries: 40

  web:
    build:
      context: .
      dockerfile: apps/flutter/Dockerfile.web
      args:
        API_BASE_URL: ${API_BASE_URL:-http://${HOST_IP:?set HOST_IP}:${CORE_PORT:-7001}}
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-7000}:80"

volumes:
  matome_localserver_pgdata:
  matome_localserver_minio:
  matome_localserver_ai_jobs:
  matome_localserver_whisper_models:
