[tools]
bun = "1.3.8"
java = "openjdk-17"
node = "24.13.0"
"aqua:supabase/cli" = "2.84.2"

[tasks.up]
description = "Start emulator + Supabase + Metro (idempotent)"
run = """
set -e

# 1. Emulator: start only if no emulator-* is online
if ! adb devices | grep -qE '^emulator-[0-9]+\\s+device$'; then
  echo '→ starting emulator pixel7...'
  ANDROID_AVD_HOME=$HOME/.config/.android/avd \
    nohup $HOME/Android/Sdk/emulator/emulator -avd pixel7 -no-boot-anim -no-snapshot-load \
    >/tmp/emulator.log 2>&1 &
  disown 2>/dev/null || true
  echo '→ waiting for boot...'
  adb wait-for-device
  until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r')" = "1" ]; do
    sleep 2
  done
  echo '→ emulator ready'
else
  echo '→ emulator already running'
fi

# 2. Supabase (idempotent — re-running is a no-op if already up)
[ -f supabase/config.toml ] || supabase init
supabase start

# 3. Regenerate .env.local from supabase status
{
  echo 'EXPO_PUBLIC_SUPABASE_URL=http://localhost:54321'
  supabase status -o env | awk -F= '/^ANON_KEY=/ { gsub(/"/, "", $2); print "EXPO_PUBLIC_SUPABASE_ANON_KEY=" $2 }'
} > .env.local

# 4. Make localhost:54321 reachable from emulator/device
adb reverse tcp:54321 tcp:54321 >/dev/null 2>&1 || true

# 5. Free port 8081 (kills any stale Metro)
fuser -k 8081/tcp 2>/dev/null || true
sleep 1

# 6. Metro (foreground, Ctrl+C to stop)
exec ./node_modules/.bin/expo start --dev-client
"""

[tasks.down]
description = "Stop Metro, Supabase, and emulator"
run = """
set +e
fuser -k 8081/tcp 2>/dev/null
supabase stop
adb devices | awk '/^emulator-[0-9]+[[:space:]]+device$/ {print $1}' | while read -r d; do
  adb -s "$d" emu kill 2>/dev/null
done
true
"""

[tasks.nuke]
description = "Stop everything + remove all Supabase containers and images"
run = """
set +e
fuser -k 8081/tcp 2>/dev/null
supabase stop --no-backup
adb devices | awk '/^emulator-[0-9]+[[:space:]]+device$/ {print $1}' | while read -r d; do
  adb -s "$d" emu kill 2>/dev/null
done
docker ps -aq --filter 'name=supabase_' | xargs -r docker rm -f
docker images -q --filter 'reference=supabase/*' | xargs -r docker rmi -f
docker images -q --filter 'reference=public.ecr.aws/supabase/*' | xargs -r docker rmi -f
true
"""
