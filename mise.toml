[tools]
bun = "1.3.8"
java = "openjdk-17"
node = "24.13.0"
erlang = "27.2"
elixir = "1.17.3-otp-27"
flutter = "latest"
"aqua:supabase/cli" = "2.84.2"

[tasks.up]
description = "Start the full local backend (Supabase + Core API + AI stub), seed dev user, idempotent. Pair with a `mise run flutter-*` client. (Same as `backend`.)"
run = """
set -e
ROOT="$(pwd)"
RUN_DIR="$ROOT/.dev"
mkdir -p "$RUN_DIR"

port_busy() { fuser -s "$1/tcp" 2>/dev/null; }

# 1. Supabase (start only if not already running — never error if it is)
[ -f supabase/config.toml ] || supabase init
if supabase status >/dev/null 2>&1; then
  echo '→ Supabase already running'
else
  supabase start
fi

# 2. Pull local backend creds from supabase status and wire Core to them.
#    Core keeps its own database (matome_api_dev) inside the Supabase Postgres,
#    isolated from the `postgres` db that holds the storage.buckets schema.
eval "$(supabase status -o env | sed 's/^/SB_/')"
export STORAGE_S3_ENDPOINT="$SB_STORAGE_S3_URL"
export STORAGE_S3_ACCESS_KEY_ID="$SB_S3_PROTOCOL_ACCESS_KEY_ID"
export STORAGE_S3_SECRET_ACCESS_KEY="$SB_S3_PROTOCOL_ACCESS_KEY_SECRET"
export STORAGE_S3_REGION="$SB_S3_PROTOCOL_REGION"
export AI_ENGINE_TOKEN="local-ai-engine-token"
export DATABASE_URL="${SB_DB_URL%/*}/matome_api_dev"

# 3. Ensure the media storage bucket exists (best effort; lives in the storage schema).
psql "$SB_DB_URL" -v ON_ERROR_STOP=1 -q -c \
  "insert into storage.buckets (id, name) values ('media', 'media') on conflict (id) do nothing;" \
  || echo '⚠ could not ensure media bucket via psql — create it in Studio if uploads fail'

# 4. Core API (port 4000): migrate then start backgrounded.
if port_busy 4000; then
  echo '→ Core API already on :4000'
else
  echo '→ preparing Core API (deps + migrations)...'
  ( cd services/api && mix deps.get && mix ecto.create --quiet && mix ecto.migrate )
  echo '→ starting Core API → .dev/core.log'
  ( cd services/api && nohup mix phx.server >"$RUN_DIR/core.log" 2>&1 & echo $! >"$RUN_DIR/core.pid" )
fi

# 5. AI stub (port 5055): token must match Core's AI_ENGINE_TOKEN.
if port_busy 5055; then
  echo '→ AI stub already on :5055'
else
  echo '→ starting AI stub → .dev/ai-stub.log'
  nohup node services/ai-stub/src/server.js >"$RUN_DIR/ai-stub.log" 2>&1 &
  echo $! >"$RUN_DIR/ai-stub.pid"
fi

# 6. Wait for Core to answer (first run compiles, can take a minute).
echo '→ waiting for Core on :4000...'
for _ in $(seq 1 90); do
  port_busy 4000 && break
  sleep 2
done

# 7. Seed the dev test user — only if it does not already exist.
if [ "$(psql "$DATABASE_URL" -tAc "select 1 from users where email='dev@matome.test'" 2>/dev/null)" = "1" ]; then
  echo '→ dev user already seeded'
else
  echo '→ seeding dev user (dev@matome.test / devpassword123)'
  curl -s -o /dev/null -X POST http://127.0.0.1:4000/api/auth/register \
    -H 'content-type: application/json' \
    -d '{"email":"dev@matome.test","password":"devpassword123"}' \
    || echo '⚠ could not seed dev user — register it manually via /api/auth/register'
fi

echo ''
echo '✓ stack up (backend — pair with a mise run flutter-* client):'
echo '   Supabase Studio  http://127.0.0.1:54323'
echo '   Core API         http://127.0.0.1:4000   (logs: tail -f .dev/core.log)'
echo '   AI stub          http://127.0.0.1:5055   (logs: tail -f .dev/ai-stub.log)'
echo ''
echo '   Login: dev@matome.test / devpassword123'
echo ''
echo '   Start a client:'
echo '     mise run flutter-web      Flutter web (Chromium)'
echo '     mise run flutter-linux    Flutter Linux desktop'
echo '     mise run flutter-android  Flutter on pixel7 emulator'
echo ''
echo '   Stop: mise run down   |   Reset everything: mise run nuke'
"""

[tasks.supabase]
description = "Start ONLY Supabase (Postgres + Storage), idempotent. The DB layer every client/backend needs."
run = """
set -e
[ -f supabase/config.toml ] || supabase init
if supabase status >/dev/null 2>&1; then
  echo '→ Supabase already running'
else
  supabase start
fi
echo '✓ Supabase up — Studio http://127.0.0.1:54323'
"""

[tasks.backend]
description = "Start the SHARED BACKEND (Supabase + Core API + AI stub), seed dev user — NO client. Run before a `mise run flutter-*` client. (Equivalent to `up`.)"
run = """
set -e
ROOT="$(pwd)"
RUN_DIR="$ROOT/.dev"
mkdir -p "$RUN_DIR"

port_busy() { fuser -s "$1/tcp" 2>/dev/null; }

# 1. Supabase (start only if not already running)
[ -f supabase/config.toml ] || supabase init
if supabase status >/dev/null 2>&1; then
  echo '→ Supabase already running'
else
  supabase start
fi

# 2. Pull local backend creds from supabase status and wire Core to them.
eval "$(supabase status -o env | sed 's/^/SB_/')"
export STORAGE_S3_ENDPOINT="$SB_STORAGE_S3_URL"
export STORAGE_S3_ACCESS_KEY_ID="$SB_S3_PROTOCOL_ACCESS_KEY_ID"
export STORAGE_S3_SECRET_ACCESS_KEY="$SB_S3_PROTOCOL_ACCESS_KEY_SECRET"
export STORAGE_S3_REGION="$SB_S3_PROTOCOL_REGION"
export AI_ENGINE_TOKEN="local-ai-engine-token"
export DATABASE_URL="${SB_DB_URL%/*}/matome_api_dev"

# 3. Ensure the media storage bucket exists (best effort).
psql "$SB_DB_URL" -v ON_ERROR_STOP=1 -q -c \
  "insert into storage.buckets (id, name) values ('media', 'media') on conflict (id) do nothing;" \
  || echo '⚠ could not ensure media bucket via psql — create it in Studio if uploads fail'

# 4. Core API (port 4000): migrate then start backgrounded.
if port_busy 4000; then
  echo '→ Core API already on :4000'
else
  echo '→ preparing Core API (deps + migrations)...'
  ( cd services/api && mix deps.get && mix ecto.create --quiet && mix ecto.migrate )
  echo '→ starting Core API → .dev/core.log'
  ( cd services/api && nohup mix phx.server >"$RUN_DIR/core.log" 2>&1 & echo $! >"$RUN_DIR/core.pid" )
fi

# 5. AI stub (port 5055): token must match Core's AI_ENGINE_TOKEN.
if port_busy 5055; then
  echo '→ AI stub already on :5055'
else
  echo '→ starting AI stub → .dev/ai-stub.log'
  nohup node services/ai-stub/src/server.js >"$RUN_DIR/ai-stub.log" 2>&1 &
  echo $! >"$RUN_DIR/ai-stub.pid"
fi

# 6. Wait for Core to answer (first run compiles, can take a minute).
echo '→ waiting for Core on :4000...'
for _ in $(seq 1 90); do
  port_busy 4000 && break
  sleep 2
done

# 7. Seed the dev test user — only if it does not already exist.
if [ "$(psql "$DATABASE_URL" -tAc "select 1 from users where email='dev@matome.test'" 2>/dev/null)" = "1" ]; then
  echo '→ dev user already seeded'
else
  echo '→ seeding dev user (dev@matome.test / devpassword123)'
  curl -s -o /dev/null -X POST http://127.0.0.1:4000/api/auth/register \
    -H 'content-type: application/json' \
    -d '{"email":"dev@matome.test","password":"devpassword123"}' \
    || echo '⚠ could not seed dev user — register it manually via /api/auth/register'
fi

echo ''
echo '✓ backend up (no client):'
echo '   Supabase Studio  http://127.0.0.1:54323'
echo '   Core API         http://127.0.0.1:4000   (logs: tail -f .dev/core.log)'
echo '   AI stub          http://127.0.0.1:5055   (logs: tail -f .dev/ai-stub.log)'
echo '   Login: dev@matome.test / devpassword123'
echo ''
echo '   Now start ONE client against it:'
echo '     mise run flutter-web      Flutter web (Chromium)'
echo '     mise run flutter-linux    Flutter Linux desktop'
echo '     mise run flutter-android  Flutter on pixel7 emulator'
echo '   Stop: mise run down'
"""

# --- Flutter lab (apps/flutter) — Home/Today on each platform vs local Core ---
# All three require the backend up first: `mise run backend` (Supabase + Core
# API on :4000 + AI stub, dev seed dev@matome.test) — NOT the full `mise run up`,
# which also boots the Next web client you don't need here. The app's AuthGate
# signs in with the seed account.

[tasks."flutter-web"]
description = "Flutter lab Home on web (Chromium) → local Core API. Run `mise run backend` first."
run = """
set -e
if ! fuser -s 4000/tcp 2>/dev/null; then
  echo '✗ Core API not on :4000. Boot the backend first: mise run backend'
  exit 1
fi
export CHROME_EXECUTABLE=/usr/bin/chromium
cd apps/flutter
exec flutter run -d chrome --web-port 8080 \
  --dart-define=API_BASE_URL=http://localhost:4000 \
  --dart-define-from-file=feature_flags.json
"""

[tasks."flutter-linux"]
description = "Flutter lab Home on Linux desktop → local Core API. Run `mise run backend` first."
run = """
set -e
if ! fuser -s 4000/tcp 2>/dev/null; then
  echo '✗ Core API not on :4000. Boot the backend first: mise run backend'
  exit 1
fi
cd apps/flutter
# Kill any still-running instance FIRST — otherwise the old window keeps the
# build/ binary locked, `flutter clean` fails, `set -e` aborts, and you stay
# looking at the stale app (the "I rebuilt but nothing changed" trap).
echo '→ stopping any running matome_flutter...'
pkill -f 'x64/(debug|release)/bundle/matome_flutter' 2>/dev/null || true
# Force a from-scratch build every launch so Dart/native changes are never
# served from a stale incremental cache (flutter run keeps the native runner
# binary even when Dart changes, which made rebuilds look like no-ops).
echo '→ flutter clean (forcing a fresh build)...'
flutter clean
flutter pub get
exec flutter run -d linux \
  --print-dtd \
  --dart-define=API_BASE_URL=http://localhost:4000 \
  --dart-define-from-file=feature_flags.json
"""

[tasks."flutter-android"]
description = "Flutter lab Home on pixel7 emulator → local Core API. Run `mise run backend` first."
run = """
set -e
if ! fuser -s 4000/tcp 2>/dev/null; then
  echo '✗ Core API not on :4000. Boot the backend first: mise run backend'
  exit 1
fi

# 1. Emulator: start pixel7 only if none online
if ! adb devices | grep -qE '^emulator-[0-9]+\\s+device$'; then
  echo '→ starting emulator pixel7...'
  ANDROID_AVD_HOME=$HOME/.config/.android/avd \
    nohup $HOME/Android/Sdk/emulator/emulator -avd pixel7 -no-boot-anim -no-snapshot-load \
    >/tmp/emulator-flutter.log 2>&1 &
  disown 2>/dev/null || true
  adb wait-for-device
  until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r')" = "1" ]; do
    sleep 2
  done
  echo '→ emulator ready'
fi

# 2. Make host Core reachable as localhost on the device, then run there.
adb reverse tcp:4000 tcp:4000 >/dev/null 2>&1 || true
DEV=$(adb devices | awk '/^emulator-[0-9]+[[:space:]]+device$/ {print $1; exit}')
cd apps/flutter
exec flutter run -d "$DEV" \
  --dart-define=API_BASE_URL=http://localhost:4000 \
  --dart-define-from-file=feature_flags.json
"""

[tasks.storybook]
description = "Run the isolated Flutter Widgetbook design catalog on Chromium"
run = """
set -e
export CHROME_EXECUTABLE=/usr/bin/chromium
cd apps/flutter_widgetbook
exec flutter run -d chrome -t lib/widgetbook.dart
"""

[tasks."flutter-design-system-check"]
description = "Run the full Flutter design-system enforcement gate"
run = """
set -e

cd apps/flutter
flutter analyze
flutter test test/core/theme/design_system_source_guard_test.dart
flutter test test/core/theme/design_system_docs_test.dart
flutter test test/core/theme/app_theme_contrast_test.dart
flutter test test/goldens/shared_widgets_golden_test.dart
flutter test test/core/theme/ui_component_coverage_guard_test.dart

cd ../flutter_widgetbook
export CHROME_EXECUTABLE=/usr/bin/chromium
generated_before=""
cleanup_widgetbook_artifacts() {
  rm -rf .dart_tool/chrome-device build
  if [ -n "$generated_before" ]; then
    rm -f "$generated_before"
  fi
}
cleanup_widgetbook_artifacts
trap cleanup_widgetbook_artifacts EXIT

generated_before="$(mktemp)"
cp lib/widgetbook.directories.g.dart "$generated_before"
set +e
dart run build_runner build
build_status=$?
set -e
if [ "$build_status" -ne 0 ]; then
  cp "$generated_before" lib/widgetbook.directories.g.dart
  exit "$build_status"
fi
if ! cmp -s "$generated_before" lib/widgetbook.directories.g.dart; then
  cp "$generated_before" lib/widgetbook.directories.g.dart
  echo '✗ apps/flutter_widgetbook/lib/widgetbook.directories.g.dart is stale. Regenerate it before running the gate.'
  exit 1
fi
flutter test -d chrome test/widgetbook_smoke_test.dart
flutter build web -t lib/widgetbook.dart
"""

[tasks.down]
description = "Stop the whole stack: Core API, AI stub, Supabase, emulator"
run = """
set +e
ROOT="$(pwd)"
RUN_DIR="$ROOT/.dev"

# Services started by `mise run up` (kill by port, then clear pidfiles)
fuser -k 4000/tcp 2>/dev/null   # Core API
fuser -k 5055/tcp 2>/dev/null   # AI stub
rm -f "$RUN_DIR/core.pid" "$RUN_DIR/ai-stub.pid"

# Supabase: stop only if running (idempotent — no error when already down)
if supabase status >/dev/null 2>&1; then
  supabase stop
else
  echo '→ Supabase already stopped'
fi

adb devices | awk '/^emulator-[0-9]+[[:space:]]+device$/ {print $1}' | while read -r d; do
  adb -s "$d" emu kill 2>/dev/null
done
true
"""

[tasks.nuke]
description = "Wipe the environment: stop everything, drop Supabase containers + volumes + images, clear caches"
run = """
set +e
ROOT="$(pwd)"
RUN_DIR="$ROOT/.dev"

echo '→ stopping local services...'
fuser -k 4000/tcp 2>/dev/null   # Core API
fuser -k 5055/tcp 2>/dev/null   # AI stub

# Supabase: stop and discard its data volumes (--no-backup drops the local DB).
echo '→ stopping Supabase + dropping volumes...'
supabase stop --no-backup

echo '→ killing emulators...'
adb devices | awk '/^emulator-[0-9]+[[:space:]]+device$/ {print $1}' | while read -r d; do
  adb -s "$d" emu kill 2>/dev/null
done

# Remove every Supabase container, volume, and image (local + ECR mirror).
echo '→ removing Supabase containers + volumes + images...'
docker ps -aq --filter 'name=supabase_' | xargs -r docker rm -f
docker volume ls -q --filter 'name=supabase_' | xargs -r docker volume rm -f
docker images -q --filter 'reference=supabase/*' | xargs -r docker rmi -f
docker images -q --filter 'reference=public.ecr.aws/supabase/*' | xargs -r docker rmi -f

# Local runtime + generated state (pidfiles, logs, supabase scaffolding).
echo '→ clearing local caches + generated state...'
rm -rf "$RUN_DIR"
rm -rf supabase/.branches supabase/.temp

echo '✓ environment wiped. Next `mise run up` rebuilds from scratch.'
true
"""
