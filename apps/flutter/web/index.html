<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="matome_flutter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!--
    Hardened CSP — task #1861, plan #131 (web wave). OPFS-persisted at-rest
    encryption (#1860) turns a transient XSS into a DURABLE breach (the
    decrypted DEK also lives in the JS heap for the session — see
    `lib/core/crypto/dek_session_guard.dart` and
    `.docs/internal/at-rest-key-flow.md` §6). This CSP is the honest
    mitigation available on the web platform: it restricts where executable
    JS can come from, which is the actual delivery vector for that XSS.

    A <meta> CSP is BEST-EFFORT ONLY — per the CSP spec, `frame-ancestors`,
    `report-uri`/`report-to`, and `sandbox` are NOT honored in a <meta> tag,
    only in a real HTTP response header. The authoritative, fuller policy
    (same script/style/connect rules PLUS frame-ancestors) is set as a
    response header in `nginx.conf`, which is how this app is actually
    served (see Dockerfile.web). This meta tag is a defense-in-depth copy for
    any deployment that serves index.html without going through that nginx
    config, and is kept in sync with it by hand — see nginx.conf's own
    comment block before editing either.

    Directive notes:
      script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline' —
        'self' for script origin (blocks 3rd-party script hosts — the
        XSS-delivery mitigation). CanvasKit must be served same-origin:
        `mise run flutter-web` and `Dockerfile.web` pass
        `--no-web-resources-cdn` so Flutter does NOT load
        gstatic.com/flutter-canvaskit (which would violate 'self').
        'wasm-unsafe-eval' (NOT the much broader 'unsafe-eval') is required
        for compiling the sqlite3 WebAssembly module (`sqlite3.wasm`).
        'unsafe-inline' is REQUIRED for `flutter run` / DWDS hot-reload
        (the debug client injects inline scripts). Production Docker
        builds STRIP this token from the meta tag after `flutter build
        web` (see Dockerfile.web) so the shipped meta stays aligned with
        nginx.conf, which NEVER allows script unsafe-inline.
      style-src 'self' 'unsafe-inline' — Flutter's web engine (text
        measurement / glassmorphism helpers) injects inline <style> at
        runtime; there is no nonce hook for this in the current Flutter web
        build output. This is a known, documented residual gap — style
        injection cannot execute arbitrary JS by itself, so it is a much
        lower-severity relaxation than allowing 3rd-party SCRIPT would be.
      connect-src 'self' http: https: ws: wss: — the app's XHR/fetch/
        WebSocket target is NOT same-origin: the Core API is a separate host
        (`AppConfig.apiBaseUrl`, e.g. http://localhost:7001) and, when the
        `ff.godMode` build flag is on (this repo's Dockerfile.web bakes it on
        for the lab/dev image — see `lib/features/dev/god_mode_host.dart`),
        the user can point the client at ANY http(s) host at runtime. A CSP
        cannot enumerate an unknown, user-chosen host in advance, so
        connect-src is left open on scheme rather than pinned to one origin
        here. THIS IS A REAL, DOCUMENTED TRADE-OFF (see the honest-limits
        note in `.docs/internal/at-rest-key-flow.md` §6): a hardened
        production deployment should build with `ff.godMode` OFF and pin
        connect-src to the exact known Core API origin instead of this
        broad form.
      img-src 'self' data: blob: — data: for inlined icons, blob: for
        locally-generated object URLs (e.g. media preview).
      media-src 'self' blob: http: https: — audio/video playback; same
        god-mode host caveat as connect-src applies to any direct
        cross-origin media URL.
      worker-src 'self' blob: — the Drift/sqlite3 Wasm worker
        (`web/drift_worker.js`).
      font-src 'self' data:; object-src 'none'; base-uri 'none';
        form-action 'self' — standard hardening, no legitimate use of any of
        these beyond 'self'/'none' in this app.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob:;
    font-src 'self' data:;
    connect-src 'self' http: https: ws: wss:;
    media-src 'self' blob: http: https:;
    worker-src 'self' blob:;
    object-src 'none';
    base-uri 'none';
    form-action 'self';
  ">
  <!-- Classic (widely-supported) referrer-policy meta form; the
       authoritative Referrer-Policy RESPONSE HEADER is set in nginx.conf. -->
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <title>matome_flutter</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
