# Security response headers — task #1861, plan #131 (web wave). This is the
# AUTHORITATIVE copy of the app's CSP + hardening headers (a real HTTP
# response header, unlike a <meta> CSP tag, supports every directive —
# notably `frame-ancestors`, which `web/index.html`'s meta-tag CSP cannot
# express at all per spec). Keep this policy's script/style/connect/media
# rules in sync with `web/index.html`'s meta CSP comment block, which
# explains the reasoning behind each relaxation (wasm-unsafe-eval for
# sqlite3.wasm, unsafe-inline style for the Flutter web engine's injected
# styles, and the open connect-src/media-src scheme required by the
# `ff.godMode` custom-backend-host feature this image's Dockerfile.web bakes
# on). See `.docs/internal/at-rest-key-flow.md` §6 for the honest-limits
# writeup this hardening pass is answering to.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # `always` so these ship on error responses (4xx/5xx) too, not just 200s.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; media-src 'self' blob: http: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
  # Legacy fallback for browsers that predate frame-ancestors support —
  # frame-ancestors above is the modern, authoritative directive.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # This app records audio (microphone) on web — explicitly allow only
  # same-origin microphone use and deny every other sensitive capability the
  # app never uses.
  add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
  # Cross-Origin-Opener-Policy: isolates this tab's browsing context group
  # (mitigates cross-window/XS-Leaks attacks) with no downside here.
  # Cross-Origin-Embedder-Policy is DELIBERATELY NOT set: `require-corp`
  # would block any cross-origin media this app loads directly (e.g. a
  # presigned MinIO/S3 URL on another origin/port, per docker-compose.yml)
  # unless that origin also sends CORP headers, which this app does not
  # control. COEP is also not required functionally — `web_opfs_blob_store.dart`
  # deliberately uses the main-thread ASYNC File System Access API, not the
  # synchronous OPFS handle that needs `crossOriginIsolated`/SharedArrayBuffer
  # (see that file's doc comment: confirmed `crossOriginIsolated: false` works
  # fine for this app's OPFS usage). Revisit if a future page-level VFS
  # (that file's "UPGRADE SEAM" note) ever needs SharedArrayBuffer.
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  # SPA fallback — any unknown path serves index.html (app uses hash routing,
  # but this keeps deep links / refresh safe).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
