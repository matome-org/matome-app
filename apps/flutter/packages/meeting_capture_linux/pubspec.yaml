name: meeting_capture_linux
description: >-
  Linux implementation of meeting_capture using ffmpeg + PulseAudio/PipeWire
  (pactl) loopback capture and ffprobe artifact validation. Declares only the
  linux platform so its dart:io process code never enters Windows/macOS bundles.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  meeting_capture:
    path: ../meeting_capture
  logging: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    implements: meeting_capture
    platforms:
      linux:
        dartPluginClass: MeetingCaptureLinux
