name: meeting_capture_macos
description: >-
  macOS (ScreenCaptureKit) implementation of meeting_capture. System audio via
  SCStream + default microphone, captured natively behind platform channels and
  encoded to a local M4A. macOS 15+ floor. Declares only the macos platform so its
  native code never enters Linux/Windows bundles.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  meeting_capture:
    path: ../meeting_capture

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    implements: meeting_capture
    platforms:
      macos:
        # dartPluginClass sets MeetingCapturePlatform.instance; pluginClass is the
        # native Swift channel handler. Both required.
        dartPluginClass: MeetingCaptureMacos
        pluginClass: MeetingCaptureMacosPlugin
