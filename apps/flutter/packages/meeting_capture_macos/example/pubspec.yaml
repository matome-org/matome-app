name: meeting_capture_macos_example
description: Example host app + integration tests for meeting_capture_macos.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  # Depends on the facade only; meeting_capture_macos is endorsed for the macos
  # target via the facade's default_package.
  meeting_capture:
    path: ../../meeting_capture
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
