name: meeting_capture_windows
description: >-
  Windows (WASAPI) implementation of meeting_capture. System-audio loopback +
  default microphone captured natively behind platform channels and encoded to a
  local M4A. Declares only the windows platform so its native code never enters
  Linux/macOS bundles.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  meeting_capture:
    path: ../meeting_capture

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    implements: meeting_capture
    platforms:
      windows:
        # dartPluginClass registers MeetingCaptureWindows as the
        # MeetingCapturePlatform implementation (sets .instance). pluginClass is
        # the native C++ handler for the method/event channels. Both are required.
        dartPluginClass: MeetingCaptureWindows
        pluginClass: MeetingCaptureWindowsPluginCApi
