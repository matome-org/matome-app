name: meeting_capture
description: >-
  Package-neutral contract, shared bounded process runner, and platform
  interface for meeting (microphone + system audio) capture. Platform
  implementations live in sibling federated packages (e.g. meeting_capture_linux)
  so per-OS capture code stays out of foreign bundles.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  # Endorsed default implementation for the linux platform. This is a DEPENDENCY
  # of the facade (required so `default_package` resolves) but is NEVER imported
  # by facade source — that is what keeps its dart:io code out of Windows/macOS
  # AOT snapshots.
  meeting_capture_linux:
    path: ../meeting_capture_linux
  meeting_capture_windows:
    path: ../meeting_capture_windows
  meeting_capture_macos:
    path: ../meeting_capture_macos

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      linux:
        default_package: meeting_capture_linux
      windows:
        default_package: meeting_capture_windows
      macos:
        default_package: meeting_capture_macos
