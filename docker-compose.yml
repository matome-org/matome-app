# Optional containerized stack: Core API + Flutter Web + Postgres + MinIO + AI stub.
# Daily DX is still `mise run up` (native). See services/api/docs/data-plane.md.
# local bring-up. Every setting comes from `.env` (copied from `.env.example`);
# `docker compose up` loads it automatically.
#
#   docker compose up --build
#     web       → http://localhost:${WEB_PORT}    Flutter Web (nginx)
#     core      → http://localhost:${CORE_PORT}   Phoenix JSON API
#     minio ui  → http://localhost:${MINIO_CONSOLE_PORT}
#
# App accounts: register via Flutter signup or POST /api/auth/register (no auto-seed).
#
# Uploads: presigned URLs point at http://localhost:${MINIO_PORT}; Core presigns
# OFFLINE so it never needs to reach MinIO for upload/download. Server-side
# object DELETE (cascade cleanup) is best-effort and no-ops from inside the
# container — not needed for the primary flows.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - matome_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${STORAGE_S3_SECRET_ACCESS_KEY}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - matome_minio:/data

  # One-shot: create the media bucket, then exit.
  minio-init:
    image: minio/mc
    depends_on:
      - minio
    environment:
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY}
      STORAGE_MEDIA_BUCKET: ${STORAGE_MEDIA_BUCKET}
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$STORAGE_S3_ACCESS_KEY_ID" "$$STORAGE_S3_SECRET_ACCESS_KEY" >/dev/null 2>&1; do
          echo "→ waiting for minio..."; sleep 1;
        done
        mc mb --ignore-existing "local/$$STORAGE_MEDIA_BUCKET"
        echo "✓ bucket $$STORAGE_MEDIA_BUCKET ready"

  ai-stub:
    build:
      context: .
      dockerfile: services/ai-stub/Dockerfile
    environment:
      AI_STUB_HOST: 0.0.0.0
      AI_STUB_PORT: ${AI_STUB_PORT}
      AI_ENGINE_DISPATCH_TOKEN: ${AI_ENGINE_DISPATCH_TOKEN}
      AI_STUB_DATA_DIR: /var/lib/matome-ai/jobs
    expose:
      - "${AI_STUB_PORT}"
    volumes:
      - matome_ai_stub_jobs:/var/lib/matome-ai/jobs

  core:
    build:
      context: ./services/api
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Lets Core reach a host-run service (the AI adapter next to the GPU whisper
    # API) via host.docker.internal when AI_ENGINE_ENDPOINT points at the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PHX_HTTP_IP: "0.0.0.0" # open all interfaces (dev default is loopback)
      PORT: ${CORE_PORT}
      DATABASE_URL: ${DATABASE_URL}
      GUARDIAN_SECRET_KEY: ${GUARDIAN_SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      # AI engine defaults to the in-compose stub (canned). Override both to use
      # the host AI adapter → real whisper transcription, e.g.:
      #   AI_ENGINE_ENDPOINT=http://host.docker.internal:7005/v1/jobs
      #   AI_ENGINE_CALLBACK_BASE_URL=http://localhost:7001   (adapter runs on host)
      AI_ENGINE_ENDPOINT: ${AI_ENGINE_ENDPOINT:-http://ai-stub:${AI_STUB_PORT}/v1/jobs}
      AI_ENGINE_DISPATCH_TOKEN: ${AI_ENGINE_DISPATCH_TOKEN}
      AI_ENGINE_CALLBACK_SIGNING_SECRET: ${AI_ENGINE_CALLBACK_SIGNING_SECRET}
      AI_ENGINE_CALLBACK_BASE_URL: ${AI_ENGINE_CALLBACK_BASE_URL:-http://core:${CORE_PORT}}
      # Storage — endpoint is the browser-facing host; presigning is offline.
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT}
      STORAGE_S3_INTERNAL_ENDPOINT: http://minio:9000
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION}
      STORAGE_MEDIA_BUCKET: ${STORAGE_MEDIA_BUCKET}
    ports:
      - "${CORE_PORT}:${CORE_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/${CORE_PORT}'"]
      interval: 5s
      timeout: 3s
      retries: 40

  web:
    build:
      context: ./apps/flutter
      dockerfile: Dockerfile.web
      args:
        API_BASE_URL: ${API_BASE_URL}
    depends_on:
      - core
    ports:
      - "${WEB_PORT}:80"

volumes:
  matome_pgdata:
  matome_ai_stub_jobs:
  matome_minio:
