# Standalone production stack for Dokploy/Dockploy or another Compose host.
# Supply .env.production (never commit it); see .env.production.example.
#
# Every public URL is derived from BASE_DOMAIN as api./app./media. subdomains,
# so the deployment is described by one name. Each derived value keeps a direct
# override (PHX_HOST, API_BASE_URL, CORS_ORIGINS, STORAGE_S3_ENDPOINT,
# AI_ENGINE_CALLBACK_BASE_URL, DATABASE_URL) for layouts that do not fit.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-matome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-matome}
    volumes:
      - matome_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_S3_ACCESS_KEY_ID:-matome}
      MINIO_ROOT_PASSWORD: ${STORAGE_S3_SECRET_ACCESS_KEY:?set STORAGE_S3_SECRET_ACCESS_KEY}
    volumes:
      - matome_minio:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    environment:
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-matome}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:?set STORAGE_S3_SECRET_ACCESS_KEY}
      STORAGE_MEDIA_BUCKET: ${STORAGE_MEDIA_BUCKET:-media}
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$STORAGE_S3_ACCESS_KEY_ID" "$$STORAGE_S3_SECRET_ACCESS_KEY" >/dev/null 2>&1; do sleep 1; done
        mc mb --ignore-existing "local/$$STORAGE_MEDIA_BUCKET"

  ai-core:
    build:
      context: ./services/ai-core
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AI_ENGINE_DISPATCH_TOKEN: ${AI_ENGINE_DISPATCH_TOKEN:?set AI_ENGINE_DISPATCH_TOKEN}
      AI_JOB_DATA_PATH: /var/lib/matome-ai-core/jobs.sqlite3
      AI_REQUIRE_HTTPS_URLS: "true"
      WHISPER_BACKEND: ${WHISPER_BACKEND:-openai}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
    volumes:
      - matome_ai_core_jobs:/var/lib/matome-ai-core
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  core:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ai-core:
        condition: service_healthy
    environment:
      PHX_HTTP_IP: 0.0.0.0
      PHX_HOST: ${PHX_HOST:-api.${BASE_DOMAIN:?set BASE_DOMAIN}}
      PORT: 7001
      # Derived from the POSTGRES_* pair so the password is declared once.
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-matome}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-matome}}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE}
      GUARDIAN_SECRET_KEY: ${GUARDIAN_SECRET_KEY:?set GUARDIAN_SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.${BASE_DOMAIN:?set BASE_DOMAIN}}
      MAILER_ADAPTER: ${MAILER_ADAPTER:?set MAILER_ADAPTER}
      SMTP_RELAY: ${SMTP_RELAY:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SSL: ${SMTP_SSL:-true}
      ADMIN_PANEL_ENABLED: ${ADMIN_PANEL_ENABLED:-false}
      ADMIN_EMAIL_ALLOWLIST: ${ADMIN_EMAIL_ALLOWLIST:-}
      ADMIN_OTP_PEPPER: ${ADMIN_OTP_PEPPER:?set ADMIN_OTP_PEPPER}
      AI_ENGINE_ENDPOINT: http://ai-core:8000/v1/jobs
      AI_ENGINE_DISPATCH_TOKEN: ${AI_ENGINE_DISPATCH_TOKEN:?set AI_ENGINE_DISPATCH_TOKEN}
      AI_ENGINE_CALLBACK_SIGNING_SECRET: ${AI_ENGINE_CALLBACK_SIGNING_SECRET:?set AI_ENGINE_CALLBACK_SIGNING_SECRET}
      AI_ENGINE_CALLBACK_BASE_URL: ${AI_ENGINE_CALLBACK_BASE_URL:-https://api.${BASE_DOMAIN:?set BASE_DOMAIN}}
      # Browser-facing object storage. AI_REQUIRE_HTTPS_URLS is on, so this must
      # be the public HTTPS host and never http://minio:9000.
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-https://media.${BASE_DOMAIN:?set BASE_DOMAIN}}
      STORAGE_S3_INTERNAL_ENDPOINT: http://minio:9000
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-matome}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:?set STORAGE_S3_SECRET_ACCESS_KEY}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-local}
      STORAGE_MEDIA_BUCKET: ${STORAGE_MEDIA_BUCKET:-media}
    ports:
      - "${CORE_PORT:-7001}:7001"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/7001'"]
      interval: 10s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/flutter/Dockerfile.web
      args:
        API_BASE_URL: ${API_BASE_URL:-https://api.${BASE_DOMAIN:?set BASE_DOMAIN}}
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy
    ports:
      # Dokploy's Traefik owns 80/443 and routes the domain to this port, so
      # publishing 80 here would collide with it.
      - "${WEB_PORT:-8080}:80"

volumes:
  matome_pgdata:
  matome_minio:
  matome_ai_core_jobs:
