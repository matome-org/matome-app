<div
  class="export-wrapper"
  style="
    width: 375px;
    min-height: 812px;
    position: relative;
    font-family: var(--font-family-body);
    background-color: var(--background);
  "
>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@100;200;300;400;500;600;700;800;900&family=Geist:wght@100;200;300;400;500;600;700;800;900&family=IBM+Plex+Mono:wght@100;200;300;400;500;600;700&family=IBM+Plex+Sans:wght@100;200;300;400;500;600;700&family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Nunito:wght@200;300;400;500;600;700;800;900&family=PT+Serif:wght@400;700&family=Roboto+Slab:wght@100;200;300;400;500;600;700;800;900&family=Roboto:wght@100;300;400;500;700;900&family=Shantell+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <html>
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=375, initial-scale=1.0" />
      <title>Spaces</title>
      <style id="theme-styles">
        :root {
          --background: #fdfdfd;
          --foreground: #333333;
          --card: #ffffff;
          --card-foreground: #333333;
          --muted: #f5f5f5;
          --muted-foreground: #8e8e93;
          --border: #e5e5e5;
          --accent: #e1b346;
          --accent-foreground: #ffffff;
          --radius-md: 12px;
          --radius-lg: 16px;
          --radius-xl: 24px;
          --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
        }

        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        .export-wrapper {
          background-color: var(--background);
          color: var(--foreground);
          font-family:
            -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
            Arial, sans-serif;
          font-size: 16px;
          line-height: 1.5;
          display: flex;
          flex-direction: column;
          height: 100vh;
          overflow: hidden;
        }
      </style>

      <style id="layout-styles">
        .screen-container {
          flex: 1;
          display: flex;
          flex-direction: column;
          height: 100%;
        }

        /* Header */
        .header {
          height: 60px;
          padding: 0 20px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          background: var(--background);
          flex-shrink: 0;
        }

        .header-title {
          font-size: 32px;
          font-weight: 700;
          color: var(--foreground);
          letter-spacing: -0.5px;
        }

        .icon-btn {
          width: 40px;
          height: 40px;
          display: flex;
          align-items: center;
          justify-content: center;
          color: var(--accent);
          background: var(--muted);
          border: none;
          border-radius: 50%;
        }

        /* Main Content */
        .content {
          flex: 1;
          overflow-y: auto;
          padding: 20px;
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 16px;
          align-content: start;
        }

        /* Space Card - Grid Version */
        .space-card {
          background: var(--card);
          border: 1px solid var(--border);
          border-radius: var(--radius-lg);
          padding: 16px;
          display: flex;
          flex-direction: column;
          gap: 12px;
          aspect-ratio: 1 / 1;
          box-shadow: var(--shadow-sm);
          position: relative;
        }

        .card-header {
          display: flex;
          justify-content: space-between;
          align-items: start;
        }

        .space-icon {
          width: 44px;
          height: 44px;
          border-radius: var(--radius-md);
          background: var(--muted);
          display: flex;
          align-items: center;
          justify-content: center;
          color: var(--foreground);
        }

        .menu-btn {
          color: var(--muted-foreground);
          padding: 4px;
          margin: -4px -4px 0 0;
        }

        .space-info {
          margin-top: auto;
        }

        .space-name {
          font-size: 17px;
          font-weight: 600;
          color: var(--foreground);
          margin-bottom: 2px;
        }

        .space-count {
          font-size: 13px;
          color: var(--muted-foreground);
        }

        /* Bottom Navigation */
        .bottom-nav {
          height: 83px;
          padding-bottom: 20px;
          border-top: 1px solid var(--border);
          background: var(--card);
          display: flex;
          justify-content: space-around;
          align-items: center;
          flex-shrink: 0;
        }

        .nav-item {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 4px;
          font-size: 10px;
          font-weight: 500;
          color: var(--muted-foreground);
          width: 60px;
        }

        .nav-item.active {
          color: var(--accent);
        }
      </style>
    </head>
    <body>
      <div class="screen-container">
        <!-- Header -->
        <header class="header">
          <div class="header-title">Spaces</div>
          <div class="icon-btn" data-media-type="banani-button">
            <div
              style="
                width: 24px;
                height: 24px;
                display: flex;
                align-items: center;
                justify-content: center;
              "
            >
              <iconify-icon
                icon="lucide:plus"
                style="font-size: 24px; color: var(--accent)"
              ></iconify-icon>
            </div>
          </div>
        </header>

        <!-- Content Grid -->
        <main class="content">
          <!-- Space Card 1 -->
          <div class="space-card" data-media-type="banani-button">
            <div class="card-header">
              <div class="space-icon">
                <iconify-icon
                  icon="lucide:briefcase"
                  style="font-size: 22px; color: currentColor"
                ></iconify-icon>
              </div>
              <div class="menu-btn" data-media-type="banani-button">
                <iconify-icon
                  icon="lucide:more-horizontal"
                  style="font-size: 20px"
                ></iconify-icon>
              </div>
            </div>
            <div class="space-info">
              <div class="space-name">Work</div>
              <div class="space-count">12 recordings</div>
            </div>
          </div>

          <!-- Space Card 2 -->
          <div class="space-card" data-media-type="banani-button">
            <div class="card-header">
              <div class="space-icon">
                <iconify-icon
                  icon="lucide:user"
                  style="font-size: 22px; color: currentColor"
                ></iconify-icon>
              </div>
              <div class="menu-btn" data-media-type="banani-button">
                <iconify-icon
                  icon="lucide:more-horizontal"
                  style="font-size: 20px"
                ></iconify-icon>
              </div>
            </div>
            <div class="space-info">
              <div class="space-name">Personal</div>
              <div class="space-count">8 recordings</div>
            </div>
          </div>

          <!-- Space Card 3 -->
          <div class="space-card" data-media-type="banani-button">
            <div class="card-header">
              <div class="space-icon">
                <iconify-icon
                  icon="lucide:lightbulb"
                  style="font-size: 22px; color: currentColor"
                ></iconify-icon>
              </div>
              <div class="menu-btn" data-media-type="banani-button">
                <iconify-icon
                  icon="lucide:more-horizontal"
                  style="font-size: 20px"
                ></iconify-icon>
              </div>
            </div>
            <div class="space-info">
              <div class="space-name">Ideas</div>
              <div class="space-count">24 recordings</div>
            </div>
          </div>

          <!-- Space Card 4 -->
          <div class="space-card" data-media-type="banani-button">
            <div class="card-header">
              <div class="space-icon">
                <iconify-icon
                  icon="lucide:book-open"
                  style="font-size: 22px; color: currentColor"
                ></iconify-icon>
              </div>
              <div class="menu-btn" data-media-type="banani-button">
                <iconify-icon
                  icon="lucide:more-horizontal"
                  style="font-size: 20px"
                ></iconify-icon>
              </div>
            </div>
            <div class="space-info">
              <div class="space-name">Journal</div>
              <div class="space-count">5 recordings</div>
            </div>
          </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
          <div class="nav-item" data-media-type="banani-button">
            <div
              style="
                width: 24px;
                height: 24px;
                display: flex;
                align-items: center;
                justify-content: center;
              "
            >
              <iconify-icon
                icon="lucide:inbox"
                style="font-size: 24px; color: currentColor"
              ></iconify-icon>
            </div>
            <span>Inbox</span>
          </div>
          <div class="nav-item active" data-media-type="banani-button">
            <div
              style="
                width: 24px;
                height: 24px;
                display: flex;
                align-items: center;
                justify-content: center;
              "
            >
              <iconify-icon
                icon="lucide:grid"
                style="font-size: 24px; color: currentColor"
              ></iconify-icon>
            </div>
            <span>Spaces</span>
          </div>
        </nav>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.7/dist/iconify-icon.min.js"></script>
    </body>
  </html>
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  <style>
    :root {
      --background: #fdfdfd;
      --foreground: #333333;
      --border: #00000014;
      --input: #ffffff;
      --primary: #e1b346;

      --secondary: #363636;
      --secondary-foreground: #fdfdfd;
      --muted: #f5f5f5;
      --muted-foreground: #666666;
      --success: #dff2e1;
      --success-foreground: #1b7a3a;
      --accent: #e1b346;
      --accent-foreground: #333333;
      --destructive: #ff4d4f;
      --destructive-foreground: #ffffff;
      --warning: #fff4e5;
      --warning-foreground: #664400;
      --card: #ffffff;
      --card-foreground: #333333;
      --sidebar: #f7f7f7;
      --sidebar-foreground: #333333;
      --sidebar-primary: #e1b346;
      --sidebar-primary-foreground: #333333;
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --radius-xl: 12px;
      --font-family-body: Inter;
    }
  </style>
</div>
